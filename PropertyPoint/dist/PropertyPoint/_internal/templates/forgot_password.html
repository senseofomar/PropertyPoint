<!DOCTYPE html>
<html>
<head>
    <title>Reset Password | PropertyPoint Gold</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body { margin: 0; padding: 0; overflow-x: hidden; background: var(--surface); }
        .split-container { display: flex; min-height: 100vh; }

        /* Left Side */
        .split-left {
            flex: 1.2;
            /* Using a different luxury architectural image to keep it fresh */
            background: linear-gradient(to right, rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.4)), url('https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?q=80&w=2053&auto=format&fit=crop') center/cover no-repeat;
            display: flex; flex-direction: column; padding: 4rem 10%; color: white;
            box-shadow: inset -10px 0 20px rgba(0,0,0,0.1);
        }

        .brand-logo-white {
            font-size: 1.8rem; font-weight: 800; color: white;
            display: flex; align-items: center; gap: 8px; margin-bottom: auto; text-decoration: none;
        }
        .brand-logo-white::after {
            content: ''; display: inline-block; width: 8px; height: 8px;
            background: var(--accent); border-radius: 50%;
        }

        .hero-text-container { margin-bottom: auto; }
        .hero-text-container h1 { font-size: 4rem; font-weight: 800; margin-bottom: 1.5rem; line-height: 1.1; letter-spacing: -1px; }
        .hero-text-container p { font-size: 1.3rem; color: #cbd5e1; max-width: 450px; line-height: 1.6; }

        /* Right Side */
        .split-right {
            flex: 1; background: var(--surface); display: flex; flex-direction: column;
            justify-content: center; align-items: center; padding: 2rem;
        }

        .form-wrapper { width: 100%; max-width: 420px; }

        @media (max-width: 960px) {
            .split-container { flex-direction: column; }
            .split-left { flex: none; padding: 3rem 2rem; min-height: 40vh; }
            .hero-text-container h1 { font-size: 2.8rem; }
            .split-right { padding: 4rem 2rem; }
        }
    </style>
</head>
<body>

<div class="split-container">
    <div class="split-left">
        <a href="/" class="brand-logo-white">PropertyPoint Gold</a>
        <div class="hero-text-container">
            <h1>Secure your<br>account.</h1>
            <p>Regain access to your premium real estate portfolio and never miss an exclusive listing.</p>
        </div>
        <div></div>
    </div>

    <div class="split-right">
        <div class="form-wrapper">
            <div style="margin-bottom: 2.5rem;">
                <span style="font-size: 2.5rem; display: block; margin-bottom: 10px;">🔐</span>
                <h2 style="font-size: 2rem; margin: 0 0 10px 0; color: var(--primary); font-weight: 800;">Reset Password</h2>
                <p style="color: var(--text-muted); margin: 0; font-size: 1.05rem;">Enter your username to securely create a new password.</p>
            </div>

            {% if error %}
                <div style="background: #fef2f2; color: var(--danger); padding: 12px; border-radius: 8px; margin-bottom: 1.5rem; text-align: center; font-weight: 600; font-size: 0.9rem; border: 1px solid #fecaca;">
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST">
                <label>Registered Username</label>
                <input type="text" name="username" placeholder="e.g. JohnDoe" required style="margin-bottom: 1.25rem;">
                
                <label>New Password</label>
                <div class="password-wrapper" style="margin-bottom: 1.5rem;">
                    <input type="password" id="npw" name="new_password" placeholder="••••••••" required style="margin-bottom: 0;">
                    <span class="eye-icon" onclick="togglePassword('npw', this)">👁️</span>
                </div>

                <button type="submit" style="background: var(--primary); color: white; font-weight: 700; font-size: 1.1rem; border-radius: var(--radius-md); padding: 14px;">Update Password</button>
            </form>

            <div style="text-align: center; margin-top: 2rem;">
                <a href="/" style="color: var(--text-muted); text-decoration: none; font-size: 0.95rem; font-weight: 600; transition: color 0.2s;" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--text-muted)'">← Back to Login</a>
            </div>
        </div>
    </div>
</div>

<script>
function togglePassword(inputId, icon) {
    const input = document.getElementById(inputId);
    if (input.type === "password") {
        input.type = "text";
        icon.innerText = "🙈"; 
    } else {
        input.type = "password";
        icon.innerText = "👁️"; 
    }
}
</script>
</body>
</html>
