<!DOCTYPE html>
<html>
<head>
    <title>Login | PropertyPoint Gold</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        /* Specific layout overrides for the split-screen login */
        body { margin: 0; padding: 0; overflow-x: hidden; background: var(--surface); }
        .split-container { display: flex; min-height: 100vh; }

        /* Left Side: Branding & Imagery */
        .split-left {
            flex: 1.2;
            background: linear-gradient(to right, rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.4)), url('https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?q=80&w=2075&auto=format&fit=crop') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            padding: 4rem 10%;
            color: white;
            box-shadow: inset -10px 0 20px rgba(0,0,0,0.1);
        }

        .brand-logo-white {
            font-size: 1.8rem; font-weight: 800; color: white;
            display: flex; align-items: center; gap: 8px; margin-bottom: auto;
        }
        .brand-logo-white::after {
            content: ''; display: inline-block; width: 8px; height: 8px;
            background: var(--accent); border-radius: 50%;
        }

        .hero-text-container { margin-bottom: auto; }
        .hero-text-container h1 {
            font-size: 4rem; font-weight: 800; margin-bottom: 1.5rem;
            line-height: 1.1; letter-spacing: -1px;
        }
        .hero-text-container p {
            font-size: 1.3rem; color: #cbd5e1; max-width: 450px; line-height: 1.6;
        }

        /* Right Side: Form */
        .split-right {
            flex: 1;
            background: var(--surface);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            position: relative;
        }

        .form-wrapper {
            width: 100%;
            max-width: 420px;
        }

        .form-wrapper h2 {
            font-size: 1.5rem; margin-bottom: 2rem; color: var(--primary); font-weight: 700;
        }

        /* Facebook-style secondary button */
        .create-btn {
            display: block;
            width: 100%;
            text-align: center;
            padding: 14px 24px;
            border: 2px solid var(--border);
            border-radius: var(--radius-md);
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
            transition: all 0.2s;
        }
        .create-btn:hover {
            background: var(--bg-page);
            border-color: var(--text-muted);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 2rem 0;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1; border-bottom: 1px solid var(--border);
        }
        .divider::before { margin-right: 1em; }
        .divider::after { margin-left: 1em; }

        /* Mobile Responsiveness */
        @media (max-width: 960px) {
            .split-container { flex-direction: column; }
            .split-left { flex: none; padding: 3rem 2rem; min-height: 40vh; }
            .hero-text-container h1 { font-size: 2.8rem; }
            .split-right { padding: 4rem 2rem; }
        }
    </style>
</head>
<body>

<div class="split-container">

    <div class="split-left">
        <div class="brand-logo-white">PropertyPoint Gold</div>
        <div class="hero-text-container">
            <h1>Explore the<br>properties<br>you love.</h1>
            <p>Connect with top-tier buyers and sellers in the world's most exclusive real estate network.</p>
        </div>
        <div></div>
    </div>

    <div class="split-right">
        <div class="form-wrapper">

            {% if error %}
                <div style="background: #fef2f2; color: var(--danger); padding: 12px; border-radius: 8px; margin-bottom: 1.5rem; text-align: center; font-weight: 600; font-size: 0.9rem; border: 1px solid #fecaca;">
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST">
                <input type="text" name="username" placeholder="Email address or username" required style="margin-bottom: 1rem;">
                <input type="password" name="password" placeholder="Password" required style="margin-bottom: 1rem;">

                <select name="role" required style="margin-bottom: 1.5rem; color: var(--text-muted);">
                    <option value="" disabled selected>Select your account type</option>
                    <option value="Buyer">Buyer</option>
                    <option value="Seller">Seller</option>
                </select>

                <button type="submit" style="background: #1877f2; color: white; font-weight: 700; font-size: 1.1rem; border-radius: var(--radius-md);">Log In</button>
            </form>

            <div style="text-align: center; margin-top: 1rem;">
                <a href="/forgot-password" style="color: #1877f2; text-decoration: none; font-size: 0.9rem; font-weight: 500;">Forgotten password?</a>
            </div>

            <div class="divider">or</div>

            <a href="/signup" class="create-btn">Create new account</a>
        </div>

        <a href="/admin-portal" style="position: absolute; bottom: 20px; right: 20px; color: var(--border); text-decoration: none; font-size: 0.8rem; transition: color 0.2s;" onmouseover="this.style.color='var(--text-muted)'" onmouseout="this.style.color='var(--border)'">Admin Access</a>
    </div>

</div>

</body>
</html>
