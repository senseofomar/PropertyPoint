{% extends "layout.html" %}

{% block title %}My Bookings{% endblock %}

{% block content %}
<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h1>My Visit Requests</h1>
        <a href="/buyer" class="btn-small" style="text-decoration: none; color: white; background: var(--primary);">Back to Properties</a>
    </div>

    <table>
        <thead>
            <tr>
                <th>Property Name</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            {% for b in bookings %}
            <tr>
                <td style="font-weight: 500;">{{ b['property_title'] }}</td>
                <td>
                    <span class="badge" style="background:
                        {% if b['status'] == 'Approved' %}#16a34a
                        {% elif b['status'] == 'Rejected' %}#dc2626
                        {% else %}#f59e0b{% endif %};">
                        {{ b['status'] }}
                    </span>
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="2" style="text-align: center; color: #64748b; padding: 2rem;">You haven't requested any visits yet.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
