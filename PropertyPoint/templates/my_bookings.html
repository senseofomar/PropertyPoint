{% extends "layout.html" %}
{% block title %}My Bookings{% endblock %}

{% block content %}
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
    <h1 style="margin: 0;">My Visit Requests</h1>
    <a href="/buyer" class="btn-small">Back to Properties</a>
</div>

<table>
    <thead><tr><th>Property Name</th><th>Status</th></tr></thead>
    <tbody>
        {% for b in bookings %}
        <tr>
            <td style="font-weight: 500;">{{ b['property_title'] }}</td>
            <td>
                <span class="badge" style="background: {% if b['status'] == 'Approved' %}#d1fae5; color: #065f46;{% elif b['status'] == 'Rejected' %}#fee2e2; color: #991b1b;{% else %}#fef3c7; color: #92400e;{% endif %};">
                    {{ b['status'] }}
                </span>
            </td>
        </tr>
        {% else %}
        <tr><td colspan="2" style="text-align: center; color: var(--text-muted); padding: 3rem;">No visit requests found.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
