<!DOCTYPE html>
<html>
<head>
    <title>Login | PropertyPoint Gold</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-body">

<div class="login-card">
    <div class="logo" style="justify-content: center; margin-bottom: 2rem; font-size: 1.8rem;">PropertyPoint Gold</div>
    <h2 style="text-align: center;">Welcome Back</h2>
    <p style="text-align: center;">Enter your credentials to access your account.</p>

    {% if error %}
        <div style="background: #fef2f2; color: var(--danger); padding: 12px; border-radius: 8px; margin-bottom: 1.5rem; text-align: center; font-weight: 600; font-size: 0.9rem;">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">
        <label>Username</label>
        <input type="text" name="username" placeholder="Enter username" required>

        <label>Password</label>
        <input type="password" name="password" placeholder="Enter password" required>

        <label>Your Role</label>
        <select name="role">
            <option>Buyer</option>
            <option>Seller</option>
            <option>Admin</option>
        </select>

        <button type="submit" style="margin-top: 1rem;">Sign In</button>
    </form>

    <div style="margin-top: 2rem; text-align: center;">
        <p style="font-size: 0.95rem;">New here? <a href="/signup" style="color: var(--accent); text-decoration: none; font-weight: 700;">Create an account</a></p>
    </div>
</div>

</body>
</html>
