{% extends "layout.html" %}
{% block title %}Join PropertyPoint Gold{% endblock %}

{% block content %}
<div class="auth-body" style="margin: -3rem -2rem; min-height: calc(100vh - 70px);">
    <div class="login-card">
        <h1 style="text-align: center; margin-bottom: 10px;">✨ Join the Network</h1>
        <p style="text-align: center; margin-bottom: 2rem;">Create your premium real estate account.</p>

        {% if error %}
            <div style="background: #fef2f2; color: var(--danger); padding: 12px; border-radius: 8px; margin-bottom: 1.5rem; text-align: center; font-weight: 600; font-size: 0.9rem;">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">
            <label>Choose a Username</label>
            <input type="text" name="username" placeholder="e.g. JohnDoe" required>

            <label>Create a Password</label>
            <div class="password-wrapper">
                <input type="password" id="pw" name="password" placeholder="••••••••" required>
                <span class="eye-icon" onclick="togglePassword('pw', this)">👁️</span>
            </div>

            <label>Confirm Password</label>
            <div class="password-wrapper">
                <input type="password" id="cpw" name="confirm_password" placeholder="••••••••" required>
                <span class="eye-icon" onclick="togglePassword('cpw', this)">👁️</span>
            </div>

            <label>I want to register as a:</label>
            <select name="role">
                <option value="Buyer">Buyer (Looking for property)</option>
                <option value="Seller">Seller (Listing property)</option>
            </select>

            <button type="submit" style="margin-top: 1rem;">Create Account</button>
        </form>

        <p style="margin-top:2rem; text-align: center; font-size: 0.95rem;">
            Already have an account? <a href="/" style="color: var(--accent); text-decoration: none; font-weight: 700;">Login here</a>
        </p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function togglePassword(inputId, icon) {
    const input = document.getElementById(inputId);
    if (input.type === "password") {
        input.type = "text";
        icon.innerText = "🙈";
    } else {
        input.type = "password";
        icon.innerText = "👁️";
    }
}
</script>
{% endblock %}
