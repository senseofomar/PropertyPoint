{% extends "layout.html" %}
{% block title %}Reset Password | PropertyPoint Gold{% endblock %}

{% block content %}
<div class="auth-body" style="margin: -3rem -2rem; min-height: calc(100vh - 70px);">
    <div class="login-card">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <span style="font-size: 3rem; display: block; margin-bottom: 10px;">🔐</span>
            <h1 style="margin: 0; font-size: 1.8rem; font-weight: 800;">Reset Password</h1>
            <p style="color: var(--text-muted); margin-top: 5px;">Enter your username to securely create a new password.</p>
        </div>

        {% if error %}
            <div style="background: #fef2f2; color: var(--danger); padding: 12px; border-radius: 8px; margin-bottom: 1.5rem; text-align: center; font-weight: 600; font-size: 0.9rem;">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">
            <label>Registered Username</label>
            <input type="text" name="username" placeholder="e.g. JohnDoe" required>
            
            <label>New Password</label>
            <div class="password-wrapper">
                <input type="password" id="npw" name="new_password" placeholder="••••••••" required>
                <span class="eye-icon" onclick="togglePassword('npw', this)">👁️</span>
            </div>

            <button type="submit" style="margin-top: 1rem;">Update Password</button>
        </form>

        <div style="margin-top:2rem; text-align: center;">
            <a href="/" style="color: var(--text-muted); text-decoration: none; font-size: 0.95rem; font-weight: 600; transition: color 0.2s;" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--text-muted)'">← Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function togglePassword(inputId, icon) {
    const input = document.getElementById(inputId);
    if (input.type === "password") {
        input.type = "text";
        icon.innerText = "🙈"; 
    } else {
        input.type = "password";
        icon.innerText = "👁️"; 
    }
}
</script>
{% endblock %}
