{% extends "layout.html" %}
{% block content %}
<div class="container">
    <h1>Seller Dashboard</h1>

    <div class="seller-form" style="max-width: 600px; margin: 0 auto 3rem auto; background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 15px rgba(0,0,0,0.05);">
        <h3>List New Property</h3>
        <form method="POST" enctype="multipart/form-data">
            <input type="text" name="title" placeholder="Property Title" required>
            <div style="display: flex; gap: 10px;">
                <input type="text" name="location" placeholder="City" required>
                <input type="number" name="price" placeholder="Price (₹)" required>
            </div>
            <select name="type" required>
                <option value="" disabled selected>Select Type</option>
                <option>Apartment</option>
                <option>Villa</option>
                <option>Commercial Office</option>
                <option>Plot</option>
                <option>Penthouse</option>
                <option>Farmhouse</option>
            </select>
            <label style="font-size: 0.8rem; color: gray;">Upload Image:</label>
            <input type="file" name="image" accept="image/*" required>
            <button type="submit" class="book-btn">Post Property</button>
        </form>
    </div>

    <h2>Your Active Listings</h2>
    <div class="property-grid">
        {% for p in properties %}
        <div class="card">
            {% if p['img_url'] %}
                <img src="{{ url_for('static', filename='uploads/' + p['img_url']) }}" style="width:100%; height:200px; object-fit:cover;">
            {% else %}
                <img src="https://images.unsplash.com/photo-1502672260266-1c1ef2d93688" style="width:100%; height:200px; object-fit:cover;">
            {% endif %}
            <div class="card-content">
                <h3>{{ p['title'] }}</h3>
                <p>📍 {{ p['location'] }}</p>
                <p class="price">₹ {{ "{:,}".format(p['price']) }}</p>
                <span class="badge">{{ p['type'] }}</span>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
